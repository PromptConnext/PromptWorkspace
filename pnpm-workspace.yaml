packages:
  - apps/*
  # Shared libraries, not deployables. Added for plan 0025: `packages/cloud-client`
  # holds the modules apps/vscode and apps/mcp must not fix twice — the cloud
  # transport (and its refresh coalescing), the wire types, the session store,
  # the retry queue and the task-ref grammar.
  - packages/*

# apps/desktop (React 18) and apps/web (React 19) share one pnpm store. Packages that reference React's types internally but
# don't declare @types/react as a real dependency (styled-jsx via next,
# @monaco-editor/react) otherwise fall back to a single shared
# phantom-hoisted @types/react — which can only match one app, and which
# re-hoists non-deterministically across installs. Each such package gets an
# explicit, correctly scoped edge via `pnpm.packageExtensions` in the root
# package.json — NOT here: this repo pins pnpm 9.x, which reads packageExtensions
# from package.json only (the pnpm-workspace.yaml location is pnpm 10+ only).
