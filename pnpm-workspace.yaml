packages:
  - apps/*

# apps/desktop (React 18), apps/web (React 19.0) and apps/corp (React 19.2)
# share one pnpm store. Packages that reference React's types internally but
# don't declare @types/react as a real dependency (styled-jsx via next,
# @monaco-editor/react, next-intl) otherwise fall back to a single shared
# phantom-hoisted @types/react — which can only match one app, and which
# re-hoists non-deterministically across installs. Give each such package an
# explicit, correctly scoped edge instead of relying on that shared phantom slot.
packageExtensions:
  "@monaco-editor/react":
    dependencies:
      "@types/react": "18.3.31"
  styled-jsx:
    dependencies:
      "@types/react": "19.2.17"
  # next-intl's locale-aware <Link> (apps/corp) must resolve corp's own
  # @types/react (19.2.x) or its children type mismatches corp components.
  next-intl:
    dependencies:
      "@types/react": "19.2.17"
