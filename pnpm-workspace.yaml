packages:
  - apps/*

# Both apps/desktop (React 18) and apps/web (React 19) share one pnpm store.
# Packages that reference React's types internally but don't declare
# @types/react as a real dependency (styled-jsx via next, @monaco-editor/react)
# otherwise fall back to a single shared phantom-hoisted @types/react — which
# can only match one app. Give each such package an explicit, correctly
# scoped edge instead of relying on that shared phantom slot.
packageExtensions:
  "@monaco-editor/react":
    dependencies:
      "@types/react": "18.3.31"
  styled-jsx:
    dependencies:
      "@types/react": "19.2.17"
