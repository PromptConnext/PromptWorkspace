[project]
name = "promptworkspace-cloud"
version = "0.1.0"
description = "Thin sync + collaboration backend for the PromptWorkspace task graph."
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "eval: golden-question RAG eval harness (M10) — subset via `pytest -m eval`",
    "rls: direct-PostgREST grant probes (plan 0014 M4) — need a real Supabase stack and two real Auth users; subset via `pytest -m rls`, configured through PROMPTWORKSPACE_RLS_SUPABASE_* (see tests/rls/conftest.py)",
    # Plan 0020. Both backends are collected by an ordinary `pytest`; the
    # supabase parameter skips itself, naming the missing variable, unless
    # PROMPTWORKSPACE_CONTRACT_SUPABASE_URL/_KEY point at a disposable instance. The marker
    # exists so the pair is selectable and reportable on its own:
    # `pytest -q -m contract`.
    "contract: repository contract cases, parametrised over both adapters",
    # Plan 0020 M5: the real-resolver twin of a monkeypatched DNS test. Run it
    # with `pytest -m network`; the default run deselects it (see addopts
    # below) because the unit suite is hermetic and public DNS is not.
    "network: needs real outbound network (DNS/HTTP) — excluded by default",
]
# `network` is the one marker the default run must not collect: a hermetic
# suite that quietly depends on a resolver lies about its own hermeticity (the
# review's single failing test). A command-line `-m` overrides this, so
# `pytest -m network` and `pytest -m contract` still select what they name.
# The contract cases are deliberately *not* deselected — their memory
# parameter costs nothing beyond the tests already present, and their supabase
# parameter skips itself when unconfigured.
addopts = "-m 'not network'"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's Depends()/Query()/Header() default-argument DI is idiomatic.
ignore = ["B008"]
