[project]
name = "promptconnext-cloud"
version = "0.1.0"
description = "Thin sync + collaboration backend for the PromptConnext task graph."
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "eval: golden-question RAG eval harness (M10) — subset via `pytest -m eval`",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's Depends()/Query()/Header() default-argument DI is idiomatic.
ignore = ["B008"]
