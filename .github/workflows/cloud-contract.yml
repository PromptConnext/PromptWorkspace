name: Cloud contract (supabase)

# Plan 0020 M4. The *memory* half of the contract suite needs nothing here: it
# lands under apps/cloud/tests/, inside pyproject.toml's `testpaths`, so ci.yml's
# `cloud` job already collects it with no step of its own. This workflow exists
# only for the half that needs a database — and it is a workflow rather than
# another job in ci.yml because its triggers are different in kind: a nightly
# cron, an explicit button, and a narrow path filter. Adding `schedule:` to
# ci.yml would instead run every app's job nightly, since that workflow computes
# its per-app gating from a diff a cron event does not have.
#
# Action pins match the SHAs ci.yml and desktop-build.yml already use; the
# Supabase CLI is installed from its own pinned release rather than a fifth
# third-party action.

on:
  schedule:
    # 03:17 UTC — off the hour, so it is not queued behind every other cron.
    - cron: "17 3 * * *"
  workflow_dispatch:
  # Nightly turnaround is too slow for exactly one diff: the adapters
  # themselves. The migrations matter too — this job is the only place they are
  # applied to a real Postgres — and so does the suite that reads them.
  pull_request:
    paths:
      - "apps/cloud/app/db/**"
      - "apps/cloud/migrations/**"
      - "apps/cloud/tests/contract/**"
      - "apps/cloud/tests/rls/**"
      - ".github/workflows/cloud-contract.yml"
  push:
    branches: [main, develop, feature/trust-outcome]
    paths:
      - "apps/cloud/app/db/**"
      - "apps/cloud/migrations/**"
      - "apps/cloud/tests/contract/**"
      - "apps/cloud/tests/rls/**"
      - ".github/workflows/cloud-contract.yml"

permissions:
  contents: read

concurrency:
  group: cloud-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The version plan 0020's M2 verification ran against.
  SUPABASE_CLI_VERSION: "2.109.1"
  CONTRACT_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/cloud/requirements.txt
      - run: pip install -r requirements.txt
        working-directory: apps/cloud

      - name: Install the Supabase CLI
        run: |
          set -euo pipefail
          url="https://github.com/supabase/cli/releases/download/v${SUPABASE_CLI_VERSION}"
          curl -fsSL -o /tmp/supabase.deb \
            "${url}/supabase_${SUPABASE_CLI_VERSION}_linux_amd64.deb"
          sudo dpkg -i /tmp/supabase.deb
          supabase --version

      # supabase/config.toml at the repository root is the whole configuration:
      # project_id PromptWorkspace, Postgres 17, db on 54322, PostgREST on 54321.
      - name: Start the local stack
        run: supabase start

      # The runner has psql (postgresql-client ships on ubuntu-latest), which is
      # what scripts/migrate.py shells out to. 0002_pw_baseline.sql refuses to
      # apply without --var embed_dim, by its requires-vars=embed_dim header.
      - name: Apply the cloud migrations
        working-directory: apps/cloud
        env:
          DATABASE_URL: ${{ env.CONTRACT_DB_URL }}
        run: python scripts/migrate.py apply --var embed_dim=1024

      # The local stack does not auto-expose tables created by a migration to
      # the Data API roles (supabase/config.toml's `auto_expose_new_tables`,
      # left unset), and migration 0006 grants only `authenticated`. The posture
      # this suite targets is production's RLS-bypassing service key, so grant
      # that role what the migrations just created. Deliberately here and not in
      # a migration: it is a property of this disposable target, not of the
      # schema.
      - name: Expose the schema to the service role
        run: |
          set -euo pipefail
          psql "$CONTRACT_DB_URL" -v ON_ERROR_STOP=1 \
            -c 'grant usage on schema public to service_role' \
            -c 'grant select, insert, update, delete on all tables in schema public to service_role' \
            -c 'grant execute on all functions in schema public to service_role'

      - name: Run the contract suite against both adapters
        working-directory: apps/cloud
        env:
          PROMPTWORKSPACE_CONTRACT_SUPABASE_URL: http://127.0.0.1:54321
          # PROMPTWORKSPACE_CONTRACT_REQUIRE_SUPABASE turns "no target configured" from a
          # skip into a failure (tests/contract/conftest.py). Without it a
          # broken stack would leave every supabase case skipped and the job
          # green, which is the exact shape of the blindness this plan fixes.
          PROMPTWORKSPACE_CONTRACT_REQUIRE_SUPABASE: "1"
        run: |
          set -euo pipefail
          PROMPTWORKSPACE_CONTRACT_SUPABASE_KEY="$(supabase status -o env --workdir "$GITHUB_WORKSPACE" \
            | sed -n 's/^SERVICE_ROLE_KEY="\(.*\)"$/\1/p')"
          if [ -z "$PROMPTWORKSPACE_CONTRACT_SUPABASE_KEY" ]; then
            echo "could not read SERVICE_ROLE_KEY from \`supabase status\`" >&2
            exit 1
          fi
          export PROMPTWORKSPACE_CONTRACT_SUPABASE_KEY
          # tests/contract/test_for_user_client_split.py is the one contract
          # case needing a real end-user JWT, so it reads the PROMPTWORKSPACE_RLS_* trio
          # (a GoTrue signup needs the anon key) rather than PROMPTWORKSPACE_CONTRACT_*.
          # Same stack, same keys, different variable names — see that
          # module's docstring for why it cannot live with the others.
          PROMPTWORKSPACE_RLS_SUPABASE_URL=http://127.0.0.1:54321 \
          PROMPTWORKSPACE_RLS_SUPABASE_ANON_KEY="$(supabase status -o env --workdir "$GITHUB_WORKSPACE" \
            | sed -n 's/^ANON_KEY="\(.*\)"$/\1/p')" \
          PROMPTWORKSPACE_RLS_SUPABASE_SERVICE_KEY="$PROMPTWORKSPACE_CONTRACT_SUPABASE_KEY" \
          PROMPTWORKSPACE_RLS_REQUIRE_SUPABASE=1 \
          pytest -q -m contract -rsx

      # The grant probes (plan 0014 M4). Separate step, not folded into the one
      # above, because it tests something categorically different: not the
      # Python `Repository` interface but a Postgres GRANT, reached over raw
      # HTTP with two real Auth users' own JWTs. A regression here is a
      # security regression — a member writing the graph around the API — and
      # it is invisible to every other suite in the repo, `-m contract`
      # included, since `InMemoryRepository` has no concept of a grant.
      #
      # This step is also why migrations/** is in this workflow's path filter:
      # it is the standing guard on 0031's revoke, replacing what was
      # one-shot manual evidence.
      - name: Run the RLS grant probes against real Postgres
        working-directory: apps/cloud
        env:
          PROMPTWORKSPACE_RLS_SUPABASE_URL: http://127.0.0.1:54321
          # Same reasoning as PROMPTWORKSPACE_CONTRACT_REQUIRE_SUPABASE above: a stack that
          # failed to come up must fail this job, not skip every case and
          # report green. This is the only verification the revoke has.
          PROMPTWORKSPACE_RLS_REQUIRE_SUPABASE: "1"
        run: |
          set -euo pipefail
          status="$(supabase status -o env --workdir "$GITHUB_WORKSPACE")"
          PROMPTWORKSPACE_RLS_SUPABASE_ANON_KEY="$(printf '%s\n' "$status" \
            | sed -n 's/^ANON_KEY="\(.*\)"$/\1/p')"
          PROMPTWORKSPACE_RLS_SUPABASE_SERVICE_KEY="$(printf '%s\n' "$status" \
            | sed -n 's/^SERVICE_ROLE_KEY="\(.*\)"$/\1/p')"
          if [ -z "$PROMPTWORKSPACE_RLS_SUPABASE_ANON_KEY" ] || [ -z "$PROMPTWORKSPACE_RLS_SUPABASE_SERVICE_KEY" ]; then
            echo "could not read ANON_KEY/SERVICE_ROLE_KEY from \`supabase status\`" >&2
            exit 1
          fi
          export PROMPTWORKSPACE_RLS_SUPABASE_ANON_KEY PROMPTWORKSPACE_RLS_SUPABASE_SERVICE_KEY
          pytest -q -m rls -rsx

      - name: Stop the local stack
        if: always()
        run: supabase stop --no-backup
