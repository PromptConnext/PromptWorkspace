name: ADR 0016 M0 spike — Windows check

# The M0 decision spike (spikes/theia-shell/) was verified manually on macOS
# arm64 (see spikes/theia-shell/docs/m0-report.md). This workflow covers the
# other exit-criteria leg — Windows x64 — which has no local machine
# available. Isolated from the main desktop build: touches nothing under
# apps/desktop, no release artifacts, CI-only.

on:
  workflow_dispatch:
  push:
    branches: ["spike/0016-theia-m0"]
    paths: ["spikes/theia-shell/**", ".github/workflows/theia-spike-windows.yml"]

jobs:
  windows-check:
    runs-on: windows-2022 # windows-latest ships VS "18", unrecognized by node-gyp's version table
    defaults:
      run:
        working-directory: spikes/theia-shell
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24 # matches the engine's node:sqlite / native-TS floor
      - name: Install (skip native postinstall builds)
        run: npm install --ignore-scripts
      - name: Restore Electron binary
        run: node node_modules/electron/install.js
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
      - name: Compile @theia/ffmpeg (checksum addon, no prebuild available)
        run: npm rebuild @theia/ffmpeg
        env:
          GYP_MSVS_VERSION: "2022"
      - name: Compile node-pty (terminal backend, no prebuild available)
        run: npm rebuild node-pty
        env:
          GYP_MSVS_VERSION: "2022"
      - name: Fetch ripgrep binary (postinstall download, no compile)
        run: node node_modules/@vscode/ripgrep/lib/postinstall.js
      - run: npx theia build --mode development
      - name: Run engine + origin-allowlist + Electron smoke checks
        run: node ci-verify.js
      - name: Upload spike logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: theia-spike-windows-logs
          path: spikes/theia-shell/*.log
          if-no-files-found: ignore
