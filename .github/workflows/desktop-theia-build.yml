name: Desktop-Theia build

# ADR 0016 M2 sub-project 4: matches desktop-build.yml's matrix/upload shape
# for apps/desktop-theia, using electron-builder instead of tauri-action.
# Each shell publishes to its own R2 prefix (installation-theia/) and updates
# independently of apps/desktop's installation/ manifest.
#
# Signing: Windows is code-signed (WINDOWS_CSC_LINK/WINDOWS_CSC_KEY_PASSWORD
# secrets — see below); macOS stays unsigned/unnotarized until an Apple
# Developer Program membership exists (apps/desktop's own Tauri build has
# neither today either, so this is at least no worse than current parity on
# that platform). Once signed, Squirrel.Mac would refuse an update built
# from an unsigned .app anyway, so macOS auto-update should be treated as
# non-functional until notarization is added — see update-lifecycle.js.

on:
  workflow_dispatch:
  push:
    tags: ["theia-v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-2022] # arm64 macOS + x64 Windows; windows-latest ships VS "18", unrecognized by node-gyp's version table (same fix as theia-spike-windows.yml)
    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        working-directory: apps/desktop-theia
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24 # becomes the bundled engine runtime (scripts/bundle-node.mjs)
          cache: pnpm
      - name: Install workspace deps
        working-directory: .
        run: pnpm install --frozen-lockfile
        env:
          GYP_MSVS_VERSION: "2022" # native module (ffmpeg/drivelist/native-keymap/node-pty) build on Windows
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # @vscode/ripgrep's postinstall download hits api.github.com; unauthenticated requests get 403 rate-limited on shared runner IPs
      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/theia-v')
        shell: bash
        run: |
          set -euo pipefail
          # REF_NAME via env, not inline interpolation, so a tag name can't
          # inject shell (same pattern desktop-build.yml uses for REF_NAME).
          version="${REF_NAME#theia-v}"
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = process.argv[1];
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          " "$version"
          echo "Set package.json version to $version"
        env:
          REF_NAME: ${{ github.ref_name }}
      - name: Build and package
        run: pnpm run package # stage:engine + theia build (production) + electron-builder
        env:
          # electron-builder auto-signs Windows when WIN_CSC_LINK is present
          # (base64-encoded .pfx, or a file path/URL) alongside
          # WIN_CSC_KEY_PASSWORD — no config-file change needed. Empty
          # secrets on a PR/dispatch run without them configured just no-op
          # (electron-builder skips signing when WIN_CSC_LINK is unset).
          WIN_CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
          # macOS: mac.identity:null in package.json already forces unsigned
          # regardless of this, but keep it explicit so a runner-local ad-hoc
          # identity is never picked up by accident.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Upload artifacts to Cloudflare R2
        shell: bash # Git Bash on Windows runners; native on macOS
        run: |
          set -euo pipefail
          cd dist
          shopt -s nullglob
          for f in *.zip *.blockmap *.exe latest*.yml; do
            echo "Uploading $f"
            aws s3 cp "$f" "s3://$R2_BUCKET/installation-theia/$f" \
              --endpoint-url "$R2_ENDPOINT"
          done
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-theia-${{ matrix.platform }}-dist
          path: |
            apps/desktop-theia/dist/*.yml
            apps/desktop-theia/dist/builder-debug.yml
          if-no-files-found: ignore
