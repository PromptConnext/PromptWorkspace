name: Desktop build

# Dispatch-only. apps/desktop is renamed but not deployed (plan 0011 / ADR
# 0028), and release tags are product-prefixed (`vscode-v*`, `mcp-v*`), so no
# tag push may start an installer build.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: write # tauri-action creates/updates a draft GitHub release
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest] # arm64 macOS + x64 Windows
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24 # becomes the bundled engine runtime
          cache: pnpm
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable (rolling branch, no version tags)
        with:
          toolchain: stable
      - uses: swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: apps/desktop/src-tauri
      # --filter scopes install to @promptworkspace/desktop + @promptworkspace/engine
      # (stage:engine's `pnpm --filter @promptworkspace/engine deploy`, run later via
      # beforeBuildCommand, needs engine's own deps present). This skips sibling
      # workspace packages — e.g. native builds and the @vscode/ripgrep download, which this build doesn't need and which
      # fail on these runners: no VS Build Tools on windows-latest, GitHub API
      # rate-limiting on macos-latest.
      - run: pnpm install --frozen-lockfile --filter @promptworkspace/desktop... --filter @promptworkspace/engine...
      - uses: tauri-apps/tauri-action@fce9c6108b31ea247710505d3aaaa893ee6768d4 # v0
        id: tauri
        with:
          projectPath: apps/desktop
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater artifact signing (minisign). With createUpdaterArtifacts:true
          # in tauri.conf.json this makes tauri-action emit the .tar.gz/.sig
          # updater bundles alongside the installers.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Upload bundles to Cloudflare R2
        shell: bash # Git Bash on Windows runners; native on macOS
        run: |
          set -euo pipefail
          # ARTIFACTS is the raw JSON array from tauri-action. Decode with jq so
          # Windows backslash paths survive (inline expression expansion would eat
          # backslashes as shell escapes). Env indirection also blocks injection.
          echo "$ARTIFACTS" | jq -r '.[]' | while IFS= read -r f; do
            f="${f%$'\r'}"                                # strip Windows CR (CRLF output)
            [ -z "$f" ] && continue
            f="${f%/}"                                    # drop any trailing slash
            base=$(printf '%s' "$f" | sed 's#.*[\\/]##')  # strip dir, fwd or backslash
            if [ -d "$f" ]; then
              # macOS .app is a directory bundle — zip it into one seekable file.
              # -y preserves symlinks so the bundle stays launchable.
              echo "Zipping bundle $base"
              ( cd "$(dirname "$f")" && zip -qry "$base.zip" "$base" )
              src="$(dirname "$f")/$base.zip"; key="$base.zip"
            else
              src="$f"; key="$base"
            fi
            echo "Uploading $key"
            aws s3 cp "$src" "s3://$R2_BUCKET/installation/$key" \
              --endpoint-url "$R2_ENDPOINT"

            # The NSIS filename embeds the version, so a download page linking
            # it has to be redeployed on every release or it points at a stale
            # build. Publish a version-free alias alongside it — the macOS
            # asset name is already version-stable, so this makes both download
            # URLs constant and the corp site (promptconnext-corp-web) never needs the version to build a
            # link. latest.json still carries the real version for the updater.
            case "$key" in
              *_x64-setup.exe)
                echo "Aliasing $key -> PromptWorkspace_x64-setup.exe"
                aws s3 cp "$src" \
                  "s3://$R2_BUCKET/installation/PromptWorkspace_x64-setup.exe" \
                  --endpoint-url "$R2_ENDPOINT"
                ;;
            esac
          done
        env:
          ARTIFACTS: ${{ steps.tauri.outputs.artifactPaths }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }} # https://<accountid>.r2.cloudflarestorage.com
          REF_NAME: ${{ github.ref_name }} # via env to avoid run-command injection

  # Fan-in: both matrix platforms have uploaded their signed updater artifacts
  # (+ .sig) to installation/. Assemble the cross-platform latest.json the
  # updater endpoint serves, then upload it. Runs once, after both builds.
  manifest:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Assemble and upload latest.json to Cloudflare R2
        shell: bash
        run: |
          set -euo pipefail
          version=$(jq -r '.version' apps/desktop/src-tauri/tauri.conf.json)
          mac_name="PromptWorkspace.app.tar.gz"
          win_name="PromptWorkspace_${version}_x64-setup.exe"
          # Pull the two signatures back from R2 (the build jobs already
          # uploaded them). Each .sig is a single-line minisign blob.
          mac_sig=$(aws s3 cp "s3://$R2_BUCKET/installation/${mac_name}.sig" - --endpoint-url "$R2_ENDPOINT")
          win_sig=$(aws s3 cp "s3://$R2_BUCKET/installation/${win_name}.sig" - --endpoint-url "$R2_ENDPOINT")
          pub_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          # jq -n --arg keeps signatures/urls as data (no shell interpolation
          # into the JSON body).
          jq -n \
            --arg version "$version" \
            --arg pub_date "$pub_date" \
            --arg mac_sig "$mac_sig" \
            --arg mac_url "$DOWNLOAD_PUBLIC_BASE_URL/${mac_name}" \
            --arg win_sig "$win_sig" \
            --arg win_url "$DOWNLOAD_PUBLIC_BASE_URL/${win_name}" \
            '{
              version: $version,
              pub_date: $pub_date,
              platforms: {
                "darwin-aarch64": { signature: $mac_sig, url: $mac_url },
                "windows-x86_64": { signature: $win_sig, url: $win_url }
              }
            }' > latest.json
          echo "Assembled latest.json for ${version}"
          aws s3 cp latest.json "s3://$R2_BUCKET/installation/latest.json" \
            --endpoint-url "$R2_ENDPOINT"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          # Public base URL of the R2 installation/ prefix — same value the corp
          # site (promptconnext-corp-web) uses for NEXT_PUBLIC_DOWNLOAD_BASE_URL, and the host of the
          # updater endpoint in tauri.conf.json. No trailing slash.
          DOWNLOAD_PUBLIC_BASE_URL: ${{ secrets.DOWNLOAD_PUBLIC_BASE_URL }}
