name: Desktop build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write # tauri-action creates/updates a draft GitHub release on tag pushes

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest] # arm64 macOS + x64 Windows
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24 # becomes the bundled engine runtime
          cache: pnpm
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable (rolling branch, no version tags)
        with:
          toolchain: stable
      - uses: swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@fce9c6108b31ea247710505d3aaaa893ee6768d4 # v0
        id: tauri
        with:
          projectPath: apps/desktop
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload bundles to Cloudflare R2
        shell: bash # Git Bash on Windows runners; native on macOS
        run: |
          set -euo pipefail
          # ARTIFACTS is the raw JSON array from tauri-action. Decode with jq so
          # Windows backslash paths survive (inline expression expansion would eat
          # backslashes as shell escapes). Env indirection also blocks injection.
          echo "$ARTIFACTS" | jq -r '.[]' | while IFS= read -r f; do
            [ -z "$f" ] && continue
            base=$(printf '%s' "$f" | sed 's#.*[\\/]##') # strip dir, fwd or backslash
            echo "Uploading $base"
            aws s3 cp "$f" "s3://$R2_BUCKET/desktop/$REF_NAME/$base" \
              --endpoint-url "$R2_ENDPOINT"
          done
        env:
          ARTIFACTS: ${{ steps.tauri.outputs.artifactPaths }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }} # https://<accountid>.r2.cloudflarestorage.com
          REF_NAME: ${{ github.ref_name }} # via env to avoid run-command injection
