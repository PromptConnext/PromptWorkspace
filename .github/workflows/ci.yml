name: CI

# Plan 0021 Milestone 1 — one workflow, one job per app that has something to
# run, each gated on the paths it owns so a marketing-copy change never runs
# the Python suite. Action pins match the SHAs desktop-build.yml already uses.
#
# `next build` is deliberately absent for both Next apps (they read
# NEXT_PUBLIC_* at build time, so a build job needs environment wiring a
# typecheck does not, and Vercel already builds both on every push), and there
# is no deploy step.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # GitHub's own `paths:` filter is workflow-level, not job-level, so the
  # per-app gating is computed once here from the diff and consumed by each
  # job's `if:`. Done with git rather than a third-party filter action so the
  # workflow adds no action pin beyond the four already trusted in this repo.
  changes:
    runs-on: ubuntu-latest
    outputs:
      cloud: ${{ steps.filter.outputs.cloud }}
      engine: ${{ steps.filter.outputs.engine }}
      web: ${{ steps.filter.outputs.web }}
      vscode: ${{ steps.filter.outputs.vscode }}
      mcp: ${{ steps.filter.outputs.mcp }}
      corp: ${{ steps.filter.outputs.corp }}
      pz_cloud: ${{ steps.filter.outputs.pz_cloud }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0 # the base commit has to be present to diff against
      - id: filter
        shell: bash
        env:
          # Via env, not inline interpolation, so a ref value can't inject shell
          # (the pattern desktop-build.yml uses for REF_NAME).
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          # A branch's first push sends an all-zero `before`, and a force-push
          # can name a commit that is no longer reachable. Either way there is
          # nothing to diff against, so run everything rather than silently
          # skip every job.
          if [ -n "$BASE_SHA" ] \
            && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null \
            && git cat-file -e "${HEAD_SHA}^{commit}" 2>/dev/null; then
            merge_base=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
            changed=$(git diff --name-only "$merge_base" "$HEAD_SHA")
            echo "Changed files between ${merge_base} and ${HEAD_SHA}:"
            printf '%s\n' "$changed" | sed 's/^/  /'
          else
            echo "No usable base commit — running every job."
            changed="__ALL__"
          fi

          # Any of these invalidates a `--frozen-lockfile` install, so every JS
          # job watches them alongside its own directory.
          root_re='(package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|\.github/workflows/ci\.yml)'
          ci_re='\.github/workflows/ci\.yml'

          emit() {
            name="$1"
            shift
            if [ "$changed" = "__ALL__" ]; then
              echo "${name}=true" >> "$GITHUB_OUTPUT"
              return
            fi
            for prefix in "$@"; do
              if printf '%s\n' "$changed" | grep -qE "^${prefix}"; then
                echo "${name}=true" >> "$GITHUB_OUTPUT"
                return
              fi
            done
            echo "${name}=false" >> "$GITHUB_OUTPUT"
          }

          emit cloud    'apps/cloud/' "$ci_re"
          emit engine   'apps/engine/' "$root_re"
          emit web      'apps/web/' "$root_re"
          # apps/vscode and apps/mcp both consume packages/pz-cloud via
          # workspace:*, so a breaking change there must fail in both.
          emit vscode   'apps/vscode/' 'packages/pz-cloud/' "$root_re"
          emit mcp      'apps/mcp/' 'packages/pz-cloud/' "$root_re"
          emit corp     'apps/corp/' "$root_re"
          emit pz_cloud 'packages/pz-cloud/' "$root_re"

  cloud:
    needs: changes
    if: needs.changes.outputs.cloud == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/cloud
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/cloud/requirements.txt
      - run: pip install -r requirements.txt
      # Lint first: sub-second, and its failures are the cheapest to read.
      - run: ruff check .
      # The suite is hermetic — tests/conftest.py pins the memory backend and
      # stub auth before app.config is imported, so no database, container or
      # network is needed. Plan 0020's contract suite lands under
      # apps/cloud/tests/contract/, inside pyproject.toml's `testpaths`, so it
      # will be collected by this same invocation with no step of its own.
      - run: pytest

  engine:
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24 # hard floor: node:sqlite and native TS execution
          cache: pnpm
      # node-pty ships prebuilds for darwin and win32 only, so on Linux its
      # install script falls through to `node-gyp rebuild` and compiles from
      # source. The filter keeps that to the engine's own copy and skips
      # apps/desktop-theia's node-pty beta, whose postinstall shells out to
      # node-gyp's compile_commands generator and fails on a modern Python.
      - run: pnpm install --frozen-lockfile --filter @promptconnext/engine...
      - run: pnpm --dir apps/engine typecheck
      - run: pnpm --dir apps/engine test

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @promptconnext/web...
      - run: pnpm --dir apps/web typecheck
      - run: pnpm --dir apps/web test

  vscode:
    needs: changes
    if: needs.changes.outputs.vscode == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter promptconnext-vscode...
      - run: pnpm --dir apps/vscode typecheck
      # `pretest` runs scripts/check-feature-detection.mjs automatically.
      - run: pnpm --dir apps/vscode test
      # Bundle here so a VSIX that cannot be built fails now, not at publish.
      - run: pnpm --dir apps/vscode build

  mcp:
    needs: changes
    if: needs.changes.outputs.mcp == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # package.json declares engines.node >=20 and esbuild targets node20,
          # but the suite is `node --test` over .ts files, which needs the
          # unflagged type stripping Node 22.18+ provides.
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @promptconnext/mcp...
      - run: pnpm --dir apps/mcp typecheck
      - run: pnpm --dir apps/mcp test
      - run: pnpm --dir apps/mcp build

  corp:
    needs: changes
    if: needs.changes.outputs.corp == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @promptconnext/corp...
      - run: pnpm --dir apps/corp typecheck
      # The only app with an ESLint config, and the only one with no test
      # framework at all — adding a runner belongs with the pricing rewrite.
      - run: pnpm --dir apps/corp lint

  # apps/vscode and apps/mcp already gate on packages/pz-cloud/**, so this job
  # is redundant for most changes. It exists so the shared library is still
  # covered on its own terms if either consumer's filter is ever narrowed.
  pz-cloud:
    needs: changes
    if: needs.changes.outputs.pz_cloud == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @promptconnext/pz-cloud...
      - run: pnpm --dir packages/pz-cloud typecheck
      - run: pnpm --dir packages/pz-cloud test
